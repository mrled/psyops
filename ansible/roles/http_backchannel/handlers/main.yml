---
- name: restart traefik
  ansible.builtin.shell: |
    launchctl bootout system/us.younix.backchannel || true
    launchctl bootstrap system /Library/LaunchDaemons/us.younix.backchannel.plist
  become: true
  changed_when: true

- name: restart traefik linux
  ansible.builtin.systemd:
    name: traefik
    state: restarted
    daemon_reload: true
  become: true

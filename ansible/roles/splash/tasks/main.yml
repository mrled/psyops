---
- name: Require macOS
  ansible.builtin.assert:
    that: ansible_distribution == "MacOSX"
    fail_msg: splash is currently supported only on macOS hosts

- name: Get Splash user's UID
  ansible.builtin.command:
    argv: [id, -u, "{{ ansible_user }}"]
  register: splash_uid
  changed_when: false
  become: false

- name: Ensure Splash directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: staff
    mode: "0750"
  loop:
    - "{{ splash_home }}"
    - "{{ splash_data_dir }}"
    - "{{ splash_hf_home }}"
    - "{{ splash_weight_cache }}"
    - "{{ splash_log_dir }}"
    - "{{ splash_user_home }}/Library/LaunchAgents"
  become: false

- name: Install Splash LaunchAgent
  ansible.builtin.template:
    src: splash.plist.j2
    dest: "{{ splash_user_home }}/Library/LaunchAgents/{{ splash_service_name }}.plist"
    owner: "{{ ansible_user }}"
    group: staff
    mode: "0644"
  become: false
  notify: Restart splash

- name: Check if Splash LaunchAgent is loaded
  ansible.builtin.command: launchctl print gui/{{ splash_uid.stdout | trim }}/{{ splash_service_name }}
  register: splash_launchd_status
  failed_when: false
  changed_when: false
  become: false

- name: Bootstrap Splash LaunchAgent if not loaded
  ansible.builtin.command:
    argv:
      - launchctl
      - bootstrap
      - "gui/{{ splash_uid.stdout | trim }}"
      - "{{ splash_user_home }}/Library/LaunchAgents/{{ splash_service_name }}.plist"
  when: splash_launchd_status.rc != 0
  become: false
  changed_when: true

- name: Ensure Splash is running
  ansible.builtin.command: launchctl kickstart gui/{{ splash_uid.stdout | trim }}/{{ splash_service_name }}
  become: false
  changed_when: false

---
- name: Getent for user home
  ansible.builtin.getent:
    database: passwd
    key: "{{ interactive_user.name }}"

- name: Set home fact
  ansible.builtin.set_fact:
    interactive_user_home: "{{ getent_passwd[interactive_user.name][4] }}"

- name: Read existing dhd origin
  become: true
  become_user: "{{ interactive_user.name }}"
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ interactive_user_home }}/.dhd"
      - config
      - --get
      - remote.origin.url
  register: interactive_user_dhd_origin
  changed_when: false
  # An unset origin returns 1; a missing checkout returns 128.
  failed_when: interactive_user_dhd_origin.rc not in [0, 1, 128]
  check_mode: false
  when: not interactive_user_disable_dhd

- name: Clone dhd repo # noqa: latest
  become: true
  become_user: "{{ interactive_user.name }}"
  ansible.builtin.git:
    repo: "{{ interactive_user_dhd_origin.stdout | default('https://github.com/mrled/dhd', true) }}"
    dest: "{{ interactive_user_home }}/.dhd"
    update: true
  when: not interactive_user_disable_dhd

- name: Symlink dotfiles from dhd
  become: true
  become_user: "{{ interactive_user.name }}"
  ansible.builtin.file:
    src: "{{ interactive_user_home }}/.dhd/hbase/{{ item }}"
    dest: "{{ interactive_user_home }}/{{ item }}"
    state: link
    force: true
  loop:
    - .bashrc
    - .inputrc
    - .profile
    - .tmux.conf
    - .vimrc
    - .zshrc
  when: not interactive_user_disable_dhd

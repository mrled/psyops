---
- name: Configure YubiKey authentication for polkit
  when: workstation_fedora_enable_yubikey | bool
  ansible.builtin.include_tasks: yubikey.yml

- name: Install graphical workstation fonts
  ansible.builtin.include_tasks: fonts.yml

- name: Configure KDE autologin
  when: workstation_fedora_kde_autologin | bool
  ansible.builtin.include_tasks: kde_autologin.yml

- name: Add 1Password RPM key
  ansible.builtin.rpm_key:
    key: https://downloads.1password.com/linux/keys/1password.asc
    state: present

- name: Add 1Password yum repository
  ansible.builtin.yum_repository:
    name: 1password
    description: 1Password Stable Channel
    baseurl: https://downloads.1password.com/linux/rpm/stable/$basearch
    enabled: true
    gpgcheck: true
    repo_gpgcheck: true
    gpgkey: https://downloads.1password.com/linux/keys/1password.asc

- name: Add Microsoft RPM key
  ansible.builtin.rpm_key:
    key: https://packages.microsoft.com/keys/microsoft.asc
    state: present

- name: Add Visual Studio Code yum repository
  ansible.builtin.yum_repository:
    name: code
    description: Visual Studio Code
    baseurl: https://packages.microsoft.com/yumrepos/vscode
    enabled: true
    gpgcheck: true
    gpgkey: https://packages.microsoft.com/keys/microsoft.asc
    metadata_expire: 1h

- name: Install DNF plugins for COPR support
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present

- name: Enable Ghostty COPR repository
  ansible.builtin.command:
    cmd: dnf -y copr enable scottames/ghostty
    creates: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:scottames:ghostty.repo

# Bootstrap RPM Fusion trust from Fedora's signed key package, without disabling GPG checks.
- name: Install distribution signing keys
  ansible.builtin.dnf:
    name: distribution-gpg-keys
    state: present

- name: Import RPM Fusion Free signing key
  ansible.builtin.rpm_key:
    key: /usr/share/distribution-gpg-keys/rpmfusion/RPM-GPG-KEY-rpmfusion-free-fedora-{{ ansible_distribution_major_version }}
    state: present

- name: Enable RPM Fusion Free repository
  ansible.builtin.dnf:
    name: https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_distribution_major_version }}.noarch.rpm
    state: present

- name: Install graphical workstation packages
  ansible.builtin.dnf:
    name:
      - 1password
      - 1password-cli
      - code
      - flatpak
      - ghostty
      - libavcodec-freeworld
      - neovim-qt
      - thunderbird
      - vlc
      - vlc-plugin-ffmpeg
      - vlc-plugins-freeworld
    state: present

- name: Add Flathub remote
  ansible.builtin.command:
    cmd: flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
  changed_when: false

- name: Install Mattermost Desktop from Flathub
  ansible.builtin.command:
    cmd: flatpak install -y flathub com.mattermost.Desktop
  register: workstation_fedora_mattermost_flatpak
  changed_when: "'Skipping: com.mattermost.Desktop' not in workstation_fedora_mattermost_flatpak.stdout"

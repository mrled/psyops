---
- name: Look up workstation user UID
  ansible.builtin.getent:
    database: passwd
    key: "{{ syncthing_user.name }}"

- name: Enable lingering for Syncthing startup before login
  ansible.builtin.command:
    argv:
      - loginctl
      - enable-linger
      - "{{ syncthing_user.name }}"
    creates: "/var/lib/systemd/linger/{{ syncthing_user.name }}"

- name: Start workstation user systemd manager
  ansible.builtin.systemd_service:
    name: "user@{{ getent_passwd[syncthing_user.name][1] }}.service"
    state: started

- name: Enable and start Syncthing user service
  become: true
  become_user: "{{ syncthing_user.name }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ getent_passwd[syncthing_user.name][1] }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ getent_passwd[syncthing_user.name][1] }}/bus"
  ansible.builtin.systemd_service:
    scope: user
    name: syncthing.service
    enabled: true
    state: started

---
- name: Resolve Deskflow RPM release asset
  ansible.builtin.set_fact:
    workstation_fedora_deskflow_asset: >-
      {{ lookup('github_release_asset', 'deskflow/deskflow',
                asset_regex=workstation_fedora_deskflow_asset_regex,
                version=workstation_fedora_deskflow_version) }}
  vars:
    workstation_fedora_deskflow_arch: "{{ {'x86_64': 'x86_64', 'aarch64': 'aarch64'}.get(ansible_architecture, ansible_architecture) }}"
    workstation_fedora_deskflow_asset_regex: >-
      ^deskflow-.+-fedora-{{ ansible_distribution_major_version | string | regex_escape }}-{{ workstation_fedora_deskflow_arch | regex_escape }}[.]rpm$

- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Install Deskflow RPM directly from GitHub release
  ansible.builtin.dnf:
    name: "{{ workstation_fedora_deskflow_asset.browser_download_url }}"
    state: present
    update_cache: true
    disable_gpg_check: true
  when: >-
    'deskflow' not in ansible_facts.packages
    or ansible_facts.packages.deskflow[0].version != (workstation_fedora_deskflow_asset.tag_name | regex_replace('^v', ''))

---
# Remove Fedora's system-wide EDITOR override without removing nano itself.
- name: Remove nano default editor configuration
  ansible.builtin.package:
    name: nano-default-editor
    state: absent

- name: Install workstation packages
  ansible.builtin.package:
    name:
      - atuin
      - awscli2
      - clang
      - curl
      - direnv
      - git-annex
      - git-crypt
      - git-delta
      - kubernetes-client
      - make
      - neovim
      - nodejs
      - npm
      - ripgrep
      - rustup
      - sqlite
      - uv
      - vim
    state: present

- name: Configure Btrfs swap
  when: workstation_fedora_swap_size | default('', true) | string | length > 0
  ansible.builtin.include_tasks: swap.yml

# Text console only: this does not remap Caps Lock in desktop environments.
- name: Configure text console keyboard
  ansible.builtin.include_tasks: console_keyboard.yml

- name: Install Pake build prerequisites
  ansible.builtin.package:
    name:
      - gcc
      - gcc-c++
      - pkgconf-pkg-config
      - gtk3-devel
      - webkit2gtk4.1-devel
      - libayatana-appindicator-gtk3-devel
      - librsvg2-devel
      - patchelf
    state: present

- name: Initialize Rust for workstation users
  ansible.builtin.include_tasks: rustup.yml
  loop: "{{ interactive_user_list }}"
  loop_control:
    loop_var: rustup_user

- name: Install Flux
  ansible.builtin.include_tasks: flux.yml

- name: Install SOPS
  ansible.builtin.include_tasks: sops.yml

- name: Install pinned Hugo release
  ansible.builtin.include_tasks: hugo.yml

# Claude Code and Codex are installed per-user via their official install
# scripts (into ~/.local), NOT system-wide as root. Both projects distribute
# curl|sh installers as the recommended method for individual users.
- name: Install AI coding agents for workstation users
  when: workstation_fedora_enable_ai_agents | bool
  ansible.builtin.include_tasks: ai_agents.yml
  loop: "{{ interactive_user_list }}"
  loop_control:
    loop_var: ai_agent_user

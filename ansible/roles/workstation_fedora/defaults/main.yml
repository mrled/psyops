---
workstation_fedora_headless: true
workstation_fedora_t2linux_enable: false
workstation_fedora_enable_ai_agents: false
workstation_fedora_enable_deskflow: false

# Autologin grants desktop access to anyone at the console.
workstation_fedora_kde_autologin: false
# Defaults to the sole interactive user; set explicitly for multi-user hosts.
workstation_fedora_kde_autologin_user: "{{ interactive_user_list[0].name if interactive_user_list | length == 1 else '' }}"
workstation_fedora_kde_autologin_session: plasma.desktop

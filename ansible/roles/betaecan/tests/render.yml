---
# Check our systemd syntax and mountpoint guards without installing units.
- name: Test backup unit rendering
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    betaecan_user: alice
    betaecan_home: /home/alice
    betaecan_randomized_delay_sec: 15m
    betaecan_job_directory: /home/alice/.config/psyops/backup/job1
    betaecan_unit: betaecan@job1
    betaecan_job:
      name: job1
      oncalendar: hourly
      paths:
        /home/alice/Documents:
        /home/alice/Pictures: {}
        /mnt/backup disk:
          mountpoint: true
        /mnt/other:
          mountpoint: false
  tasks:
    - name: Check rendered units
      block:
        - name: Create temporary rendering directory
          ansible.builtin.tempfile:
            state: directory
          register: betaecan_test_directory

        - name: Render units
          ansible.builtin.template:
            src: "{{ playbook_dir | dirname }}/templates/{{ item }}.j2"
            dest: "{{ betaecan_test_directory.path }}/{{ betaecan_unit }}.{{ item }}"
            mode: '0600'
          loop: [service, timer]

        - name: Verify user-unit syntax
          ansible.builtin.command:
            argv:
              - systemd-analyze
              - --user
              - verify
              - "{{ betaecan_test_directory.path }}/{{ betaecan_unit }}.service"
              - "{{ betaecan_test_directory.path }}/{{ betaecan_unit }}.timer"
          environment:
            XDG_RUNTIME_DIR: "{{ betaecan_test_directory.path }}"
          register: betaecan_test_verify
          changed_when: false
          # The helper is deliberately not installed on the controller.
          failed_when: >-
            betaecan_test_verify.stderr_lines
            | reject('search', 'Command /home/alice/.local/bin/betaecanjob is not executable:')
            | list | length > 0

        - name: Read rendered service
          ansible.builtin.slurp:
            src: "{{ betaecan_test_directory.path }}/{{ betaecan_unit }}.service"
          register: betaecan_test_service

        - name: Check that only required mountpoints guard the backup
          ansible.builtin.assert:
            that:
              - "(betaecan_test_service.content | b64decode).splitlines() | select('match', '^ConditionPathIsMountPoint=') | list == ['ConditionPathIsMountPoint=/mnt/backup disk']"
      always:
        - name: Remove rendered units
          ansible.builtin.file:
            path: "{{ betaecan_test_directory.path }}"
            state: absent
          when: betaecan_test_directory.path is defined

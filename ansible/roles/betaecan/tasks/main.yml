---
- name: Require unique job names
  ansible.builtin.assert:
    that:
      - betaecan_jobs | map(attribute='name') | unique(case_sensitive=true) | length == betaecan_jobs | length
    fail_msg: Backup jobs must have unique names.

- name: Validate backup jobs before making changes
  ansible.builtin.include_tasks: validate_job.yml
  loop: "{{ betaecan_jobs }}"
  loop_control:
    loop_var: betaecan_job
    label: "{{ betaecan_job.name }}"

- name: Look up the backup account
  ansible.builtin.getent:
    database: passwd
    key: "{{ betaecan_user }}"

- name: Set account paths
  ansible.builtin.set_fact:
    betaecan_home: "{{ ansible_facts.getent_passwd[betaecan_user][4] }}"
    betaecan_group: "{{ ansible_facts.getent_passwd[betaecan_user][2] }}"
    betaecan_uid: "{{ ansible_facts.getent_passwd[betaecan_user][1] }}"
    betaecan_user_unit_directory: "{{ ansible_facts.getent_passwd[betaecan_user][4] }}/.config/systemd/user"

- name: Install backup prerequisites
  ansible.builtin.package:
    name:
      - restic
      - systemd
      - python3
      - python3-keyring
      - python3-secretstorage
      - ca-certificates
    state: present

- name: Keep the user manager running without an interactive login
  ansible.builtin.command:
    argv: [loginctl, enable-linger, "{{ betaecan_user }}"]
    creates: "/var/lib/systemd/linger/{{ betaecan_user }}"
  when: betaecan_jobs | length > 0

- name: Start the user manager
  ansible.builtin.systemd_service:
    name: "user@{{ betaecan_uid }}.service"
    state: started
  when: betaecan_jobs | length > 0

- name: Prepare shared configuration on the controller
  ansible.builtin.set_fact:
    betaecan_directories:
      - path: "{{ betaecan_home }}/.local/bin"
        owner: "{{ betaecan_user }}"
        group: "{{ betaecan_group }}"
        mode: "0755"
      - path: "{{ betaecan_user_unit_directory }}"
        owner: "{{ betaecan_user }}"
        group: "{{ betaecan_group }}"
        mode: "0700"
    betaecan_files: []
    betaecan_configured_jobs: []
    betaecan_units: []

- name: Render each backup job on the controller
  ansible.builtin.include_tasks: job.yml
  loop: "{{ betaecan_jobs }}"
  loop_control:
    loop_var: betaecan_job
    label: "{{ betaecan_job.name }}"

- name: Configure backups as the backup user
  become: true
  become_user: "{{ betaecan_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ betaecan_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ betaecan_uid }}/bus"
  block:
    - name: Create leaf directories and any missing parents
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
        state: directory
      loop: "{{ betaecan_directories }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Install backup and credential cache commands
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ betaecan_home }}/.local/bin/{{ item.dest }}"
        mode: "0755"
      loop:
        - {src: betaecanjob, dest: betaecanjob}
        - {src: betaecancache.py, dest: betaecancache}

    - name: Install job configuration and rendered units
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ item.path }}"
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop: "{{ betaecan_files }}"
      loop_control:
        label: "{{ item.path }}"
      register: betaecan_copies

    - name: Store job credentials in the desktop wallet
      ansible.builtin.command:
        argv: ["{{ betaecan_home }}/.local/bin/betaecancache", store]
        stdin: "{{ betaecan_configured_jobs | to_json }}"
        stdin_add_newline: false
      register: betaecan_wallet_store
      changed_when: betaecan_wallet_store.stdout | default('') == 'changed'
      when: betaecan_jobs | length > 0
      no_log: true

    - name: Populate each job's runtime credential cache
      ansible.builtin.command:
        argv: ["{{ betaecan_home }}/.local/bin/betaecancache", unlock, "{{ item.name }}"]
      register: betaecan_cache_unlock
      changed_when: betaecan_cache_unlock.stdout | default('') == 'changed'
      loop: "{{ betaecan_jobs }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    - name: Identify changed units on the controller
      ansible.builtin.set_fact:
        betaecan_changed_units: >-
          {{ betaecan_copies.results | default([]) | selectattr('changed')
             | selectattr('item.unit', 'defined') | map(attribute='item.unit') | unique | list }}

    # Reload once, even after a previous run failed after copying units.
    - name: Reload user units
      ansible.builtin.systemd_service:
        scope: user
        daemon_reload: true
      when: betaecan_units | length > 0

    - name: Enable and start backup timers, restarting those with changed units
      ansible.builtin.systemd_service:
        scope: user
        name: "{{ item }}.timer"
        enabled: true
        state: "{{ 'restarted' if item in betaecan_changed_units else 'started' }}"
      loop: "{{ betaecan_units }}"

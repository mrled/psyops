[Unit]
Requires=mindless-workspace.service
After=mindless-workspace.service

[Service]
Environment=HOME=/root
ExecStart=
ExecStart=/usr/sbin/tailscaled --tun=userspace-networking --statedir=/workspace/tailscale --state=/workspace/tailscale/tailscaled.state --socket=/run/tailscale/tailscaled.sock --port=${PORT} $FLAGS
StateDirectory=

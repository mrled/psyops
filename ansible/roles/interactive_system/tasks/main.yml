---
- name: Create users
  ansible.builtin.user:
    name: "{{ item }}"
    state: present
  loop: "{{ interactive_system_create_users }}"

- name: Install packages
  ansible.builtin.package:
    name:
      - atuin
      - git
      - ripgrep
      - tmux
      - vim
      - zsh
    state: present

- name: Set shell to zsh for users
  ansible.builtin.user:
    name: "{{ item }}"
    shell: /usr/bin/zsh
  loop: "{{ interactive_system_zsh_users }}"

# The stock /etc/zlogout clears the screen on logout, which is useless and
# annoying. Move it aside rather than delete it so it's recoverable.
- name: Move /etc/zlogout aside
  ansible.builtin.command:
    cmd: mv /etc/zlogout /etc/zlogout.dist
    creates: /etc/zlogout.dist
    removes: /etc/zlogout

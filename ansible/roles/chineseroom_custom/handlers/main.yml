---
- name: reconfigure squid
  ansible.builtin.systemd:
    name: squid
    state: reloaded

- name: restart squid
  ansible.builtin.systemd:
    name: squid
    state: restarted

- name: Restart sshd
  ansible.builtin.systemd:
    name: sshd
    state: restarted

- name: regen custom nginx mappings
  ansible.builtin.command: "{{ chineseroom_nginx_mapping_script }}"
  changed_when: false

---
# Check our systemd syntax and mountpoint guards without installing units or using TPM.
- name: Test backup unit rendering
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    urestic_user: alice
    urestic_home: /home/alice
    urestic_group: '1000'
    urestic_randomized_delay_sec: 15m
    urestic_job_directory: /home/alice/.config/psyops/backup/job1
    urestic_credential_directory: /etc/credstore.encrypted/urestic/alice/job1
    urestic_unit: urestic-alice@job1
    urestic_job:
      name: job1
      oncalendar: hourly
      paths:
        /home/alice/Documents:
        /home/alice/Pictures: {}
        /mnt/backup disk:
          mountpoint: true
        /mnt/other:
          mountpoint: false
  tasks:
    - name: Check rendered units
      block:
        - name: Create temporary rendering directory
          ansible.builtin.tempfile:
            state: directory
          register: urestic_test_directory

        - name: Render units
          ansible.builtin.template:
            src: "{{ playbook_dir | dirname }}/templates/{{ item }}.j2"
            dest: "{{ urestic_test_directory.path }}/{{ urestic_unit }}.{{ item }}"
            mode: '0600'
          loop: [service, timer]

        - name: Verify systemd syntax
          ansible.builtin.command:
            argv:
              - systemd-analyze
              - verify
              - "{{ urestic_test_directory.path }}/{{ urestic_unit }}.service"
              - "{{ urestic_test_directory.path }}/{{ urestic_unit }}.timer"
          register: urestic_test_verify
          changed_when: false
          # The helper is deliberately not installed on the controller.
          failed_when: >-
            urestic_test_verify.stderr_lines
            | reject('search', 'Command /usr/local/libexec/urestic/uresticjob is not executable:')
            | list | length > 0

        - name: Read rendered service
          ansible.builtin.slurp:
            src: "{{ urestic_test_directory.path }}/{{ urestic_unit }}.service"
          register: urestic_test_service

        - name: Check that only required mountpoints guard the backup
          ansible.builtin.assert:
            that:
              - "(urestic_test_service.content | b64decode).splitlines() | select('match', '^ConditionPathIsMountPoint=') | list == ['ConditionPathIsMountPoint=/mnt/backup disk']"
      always:
        - name: Remove rendered units
          ansible.builtin.file:
            path: "{{ urestic_test_directory.path }}"
            state: absent
          when: urestic_test_directory.path is defined

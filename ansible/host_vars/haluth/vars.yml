---
ansible_host: haluth-linux.banded-goblin.ts.net
ansible_user: root

ssh_authorized_keys_users:
  root: "{{ global_personal_ssh_keys }}"

workstation_fedora_headless: false
workstation_fedora_flux_version: v2.10.0
workstation_fedora_swap_size: 16G
workstation_fedora_t2linux_enable: true
workstation_fedora_enable_deskflow: true
workstation_fedora_enable_google_chrome: true
workstation_fedora_enable_syncthing: true
workstation_fedora_enable_yubikey: true
workstation_fedora_kde_autologin: true
workstation_fedora_kde_autologin_user: micahrl
linuxbrew_enable: true
linuxbrew_user: micahrl

interactive_user_list:
  - name: micahrl
interactive_system_zsh_users: "{{ interactive_user_list | map(attribute='name') | list }}"

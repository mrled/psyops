apiVersion: apps/v1
kind: Deployment
metadata:
  name: bk2-metube
  namespace: tortuga
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bk2-metube
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bk2-metube
    spec:
      securityContext:
        fsGroup: ${plexGid}
      containers:
      - name: metube
        image: ghcr.io/alexta69/metube:latest@sha256:549f4b0eeb13b01ecae2a20b50153d17481b1d59b517de5ae0dddee03e058745
        ports:
        - containerPort: 8081
        env:
        - name: MAX_CONCURRENT_DOWNLOADS
          value: "5"
        - name: DOWNLOAD_DIR
          value: /media/Trix/stash/metube
        - name: DOWNLOAD_DIRS_INDEXABLE
          value: "true"
        - name: STATE_DIR
          value: /state
        - name: TEMP_DIR
          value: /temporary
        - name: PUBLIC_HOST_URL
          value: https://bk2.${productionClusterFqdn}/
        - name: UID
          value: ${quote}${plexUid}${quote}
        - name: GID
          value: ${quote}${plexGid}${quote}
        - name: LOGLEVEL
          value: INFO
        - name: YTDL_OPTIONS_FILE
          value: /options/options.json
        volumeMounts:
        - mountPath: /temporary
          name: metube-temp
          readOnly: false
        - mountPath: /state
          name: bk2-metube-state-pvc
          readOnly: false
        - mountPath: /media
          name: seedboxmedia-nfs
          readOnly: false
        - mountPath: /options
          name: bk2-ytdl-options
          readOnly: true
      volumes:
      - name: metube-temp
        emptyDir: {}
      - name: bk2-metube-state-pvc
        persistentVolumeClaim:
          claimName: bk2-metube-state-pvc
      - name: seedboxmedia-nfs
        persistentVolumeClaim:
          claimName: seedboxmedia-nfs-pvc
      - name: bk2-ytdl-options
        configMap:
          name: bk2-ytdl-options

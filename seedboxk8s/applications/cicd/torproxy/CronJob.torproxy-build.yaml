apiVersion: batch/v1
kind: CronJob
metadata:
  name: torproxy-build
  namespace: cicd
spec:
  schedule: "37 3 * * *"
  timeZone: America/Chicago
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          containers:
            - name: build-container
              image: quay.io/buildah/stable@sha256:e6e43d83948ac3b1e7728e8a1431e71de503fee14c7e647e7c0dc0cabaa5c9df
              # Buildah requires the same privileges as the former one-shot build job.
              securityContext:
                privileged: true
                allowPrivilegeEscalation: true
              command: ["/bin/sh", "/config/buildah.sh"]
              env:
                - name: CLUSTERGIT_IMAGENAMESPACE
                  value: tor
                - name: CLUSTERGIT_IMAGENAME
                  value: torproxy
                - name: CLUSTERGIT_IMAGETAG
                  value: latest
                - name: CLUSTERGIT_REGISTRY
                  value: registry.${productionClusterFqdn}
                - name: CLUSTERGIT_REGISTRY_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: registry-user-cicd
                      key: username
                - name: CLUSTERGIT_REGISTRY_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: registry-user-cicd
                      key: password
              volumeMounts:
                - name: varlibcontainers
                  mountPath: /var/lib/containers
                - name: build-job-config
                  mountPath: /config
          restartPolicy: Never
          volumes:
            - name: varlibcontainers
              emptyDir: {}
            - name: build-job-config
              configMap:
                name: torproxy-build

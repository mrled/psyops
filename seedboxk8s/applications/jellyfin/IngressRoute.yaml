apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin-tailscale-https
  namespace: tortuga
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Jellyfin
    gethomepage.dev/group: Media
    gethomepage.dev/icon: jellyfin
    gethomepage.dev/href: https://jellyfin.${productionClusterFqdn}
    gethomepage.dev/pod-selector: app.kubernetes.io/name=jellyfin
spec:
  ingressClassName: traefik-tailscale
  entryPoints:
    - websecure
  routes:
    - match: Host(`jellyfin.${productionClusterFqdn}`)
      kind: Rule
      services:
        - name: jellyfin
          kind: Service
          port: 8096
  tls:
    secretName: seedbox-wildcard-backing-secret

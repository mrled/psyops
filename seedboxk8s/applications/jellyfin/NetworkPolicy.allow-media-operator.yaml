apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jellyfin-allow-media-operator
  namespace: tortuga
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: media-operator
      ports:
        - port: 8096
          protocol: TCP

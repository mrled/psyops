apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia
  namespace: authelia
data:
  configuration.yaml: |
    ---
    theme: auto

    server:
      address: tcp://0.0.0.0:9091
      asset_path: /config/assets
      endpoints:
        authz:
          forward-auth:
            implementation: ForwardAuth

    log:
      level: debug
      format: text
      keep_stdout: true

    authentication_backend:
      file:
        path: /users/users.yml
        watch: false
        search:
          email: true
        password:
          algorithm: argon2
          argon2:
            variant: argon2id

    session:
      name: authelia_session
      same_site: lax
      inactivity: 180d
      expiration: 180d
      remember_me: 180d
      cookies:
        - domain: ${productionClusterFqdn}
          authelia_url: https://auth.${productionClusterFqdn}
          default_redirection_url: https://whoami-authelia.${productionClusterFqdn}
      redis:
        host: redict
        port: 6379
        username: authelia

    storage:
      local:
        path: /config/db.sqlite3

    notifier:
      disable_startup_check: true
      filesystem:
        filename: /config/notification.txt

    # Schema: https://github.com/authelia/authelia/blob/v4.39.20/internal/configuration/schema/identity_providers.go
    identity_providers:
      oidc:
        # hmac_secret is supplied by AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE.
        jwks:
          - key: {{ secret "/secrets/OIDC_JWKS_PRIMARY_RSA_PRIVATE_KEY" | mindent 10 "|" | msquote }}
        clients:
          # https://bookorbit.app/oidc — public Authorization Code client with PKCE.
          - client_id: bookorbit
            client_name: BookOrbit
            public: true
            authorization_policy: one_factor
            require_pkce: true
            pkce_challenge_method: S256
            token_endpoint_auth_method: none
            redirect_uris:
              - https://bookorbit.${productionClusterFqdn}/oauth2-callback
            scopes:
              - openid
              - profile
              - email
              - groups
            response_types:
              - code
            grant_types:
              - authorization_code
            userinfo_signed_response_alg: none

    access_control:
      default_policy: deny
      rules:
        - domain:
            - headlamp.${productionClusterFqdn}
          subject:
            - user:freeleech
          policy: one_factor
        - domain:
            - whoami-authelia.${productionClusterFqdn}
            - opensearch.${productionClusterFqdn}
            - bazarr.${productionClusterFqdn}
            - sonarr.${productionClusterFqdn}
            - bindery.${productionClusterFqdn}
            - bk2.${productionClusterFqdn}
            - bookorbit.${productionClusterFqdn}
            - cops.${productionClusterFqdn}
            - ersatztv.${productionClusterFqdn}
            - grafana.${productionClusterFqdn}

            - hydra2.${productionClusterFqdn}
            - lazylib.${productionClusterFqdn}
            - lazylibrarian.${productionClusterFqdn}
            - library.${productionClusterFqdn}
            - lidarr.${productionClusterFqdn}
            - nzbhydra2.${productionClusterFqdn}
            - prowlarr.${productionClusterFqdn}
            - radarr.${productionClusterFqdn}
            - registry-browser.${productionClusterFqdn}
            - sabnzbd.${productionClusterFqdn}
            - seedbox.${productionClusterFqdn}
            - ${productionClusterFqdn}
            - shhh.${productionClusterFqdn}
            - tautulli.${productionClusterFqdn}
            - transmission.${productionClusterFqdn}
            - traefik-localnet.${productionClusterFqdn}
            - traefik-tailscale.${productionClusterFqdn}
            - whoami.${productionClusterFqdn}
            - whoami-newcert.${productionClusterFqdn}
            - whoami-newcert.${testingClusterFqdn}
            - x3.${productionClusterFqdn}
          policy: one_factor

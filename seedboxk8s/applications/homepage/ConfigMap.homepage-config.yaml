apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  kubernetes.yaml: |
    mode: cluster
    traefik: true
  settings.yaml: |
    title: Seedbox
    theme: dark
    color: slate
    headerStyle: clean
    target: _blank
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: cluster
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - datetime:
        text_size: xl
        format:
          timeStyle: short
          dateStyle: short
          hourCycle: h23
  services.yaml: ""
  bookmarks.yaml: |
    - psyops:
        - Renovate Dashboard:
            - abbr: RD
              href: https://github.com/mrled/psyops/issues/1
        - Pull Requests:
            - abbr: PR
              href: https://github.com/mrled/psyops/pulls
  docker.yaml: ""
  custom.css: ""
  custom.js: ""

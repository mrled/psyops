apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: renovate
spec:
  schedule: "17 * * * *"
  timeZone: America/Chicago
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          containers:
            - name: renovate
              image: renovate/renovate:44.199.0
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  RENOVATE_TOKEN="$(node /etc/renovate/github-app-token.js)"
                  export RENOVATE_TOKEN
                  node /etc/renovate/render-config.js
                  export RENOVATE_CONFIG_FILE=/tmp/renovate-config.json
                  exec renovate
              env:
                - name: LOG_LEVEL
                  value: info
                - name: RENOVATE_CONFIG_FILE
                  value: /etc/renovate/config.json
                - name: RENOVATE_BASE_DIR
                  value: /tmp/renovate
                - name: GITHUB_APP_REPOSITORY
                  value: mrled/psyops
              envFrom:
                - secretRef:
                    name: renovate-env
                - secretRef:
                    name: seedboxk8s-config
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 2Gi
              volumeMounts:
                - name: config
                  mountPath: /etc/renovate
                  readOnly: true
                - name: registry-auth
                  mountPath: /etc/renovate-registry
                  readOnly: true
                - name: work
                  mountPath: /tmp/renovate
          volumes:
            - name: config
              configMap:
                name: renovate-config
            - name: registry-auth
              secret:
                secretName: registry-k8s-dockerconfigjson
            - name: work
              persistentVolumeClaim:
                claimName: renovate-work-pvc

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bookorbit-postgres
  namespace: tortuga
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bookorbit-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bookorbit
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bookorbit-postgres-dump
      ports:
        - protocol: TCP
          port: 5432

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bookorbit-postgres
  namespace: tortuga
spec:
  replicas: 1
  serviceName: bookorbit-postgres
  selector:
    matchLabels:
      app.kubernetes.io/name: bookorbit-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bookorbit-postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg18
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: bookorbit
            - name: POSTGRES_DB
              value: bookorbit
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bookorbit-env
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          startupProbe:
            exec:
              command: [pg_isready, -U, bookorbit, -d, bookorbit]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [pg_isready, -U, bookorbit, -d, bookorbit]
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bookorbit-postgres-pvc

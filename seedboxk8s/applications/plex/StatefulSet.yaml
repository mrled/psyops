apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: plex
  namespace: tortuga
  annotations:
    configmap.reloader.stakater.com/reload: plex-log-forwarder
spec:
  # I think this serviceName must match the name of the Service in the same directory.
  serviceName: plex
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: plex
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: pms
      labels:
        app.kubernetes.io/name: plex
    spec:
      securityContext:
        fsGroup: ${plexGid}
      initContainers:
        - name: import-data
          image: busybox:1.38.0
          command:
            - sh
            - -c
            # BE VERY CAREFUL WITH TRAILING SEMICOLONS
            - >
              if test "$DANGER_CLEAR_EXISTING_DATA" = "true"; then
                for f in /config/{*,.*}; do
                  if test "$f" = "/config/." || test "$f" = "/config/.."; then
                    continue;
                  fi;
                  echo "Removing $f recursively...";
                  rm -f "$f";
                done;
                rm -rf /config/*;
              elif test -f /config/import-data-complete; then
                exit 0;
              fi;
              while test ! -f /import/import-data-ready; do
                sleep 1;
              done;
              echo "Extracting data...";
              tar -xvf /import/import.tar.gz -C /config;
              echo "Extraction complete.";
              touch /config/import-data-complete;
              exit 0;
          env:
            - name: DANGER_CLEAR_EXISTING_DATA
              value: "false"
          volumeMounts:
            - name: plex-config-pvc
              mountPath: /config
            - name: import
              mountPath: /import
      containers:
        - name: plex-logs
          # Match the cluster's existing Fluent Bit image.
          image: cr.fluentbit.io/fluent/fluent-bit:5.1.3
          args:
            - -c
            - /fluent-bit/plex/fluent-bit.conf
          securityContext:
            runAsNonRoot: true
            runAsUser: ${plexUid}
            runAsGroup: ${plexGid}
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: plex-config-pvc
              mountPath: /plex-logs
              subPath: Library/Application Support/Plex Media Server/Logs
              readOnly: true
            - name: log-forwarder-config
              mountPath: /fluent-bit/plex
              readOnly: true
            - name: log-forwarder-state
              mountPath: /state
        - image: plexinc/pms-docker:1.43.7.11114-4b588ea35
          name: pms
          resources:
            requests:
              memory: 2Gi
            limits:
              # Contain transcode memory spikes so they cannot exhaust the host.
              memory: 4Gi
              # The device plugin grants device access as well as injecting /dev/dri.
              gpu.intel.com/i915: 1
          ports:
            - containerPort: 32400
              protocol: TCP
          env:
            - name: PLEX_UID
              value: ${quote}${plexUid}${quote}
            - name: PLEX_GID
              value: ${quote}${plexGid}${quote}
            - name: TZ
              value: ${timezone}
            - name: VERSION
              value: docker
            - name: UMASK_SET
              value: "022"
            # This should resolve to a local IP address for local clients like the AppleTV to use.
            - name: ADVERTISE_IP
              value: "http://${clusterLocalnetPrimaryFqdn}:32400/"
            - name: CHANGE_CONFIG_DIR_OWNERSHIP
              value: "false"
          livenessProbe:
            exec:
              command:
              - pgrep
              - -f
              - /usr/lib/plexmediaserver/Plex Media Server
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - mountPath: /config
              name: plex-config-pvc
              readOnly: false
            - mountPath: /media
              name: seedboxmedia-nfs
              readOnly: false
            - mountPath: /transcode
              name: transcode-tmp
              readOnly: false
      volumes:
        - name: log-forwarder-config
          configMap:
            name: plex-log-forwarder
        - name: log-forwarder-state
          emptyDir:
            sizeLimit: 32Mi
        - name: import
          emptyDir: {}
        - name: plex-config-pvc
          persistentVolumeClaim:
            claimName: plex-config-pvc
        - name: seedboxmedia-nfs
          persistentVolumeClaim:
            claimName: seedboxmedia-nfs-pvc
        - name: transcode-tmp
          emptyDir: {}

apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-prometheus-stack-values
  namespace: prometheus
data:
  values.yaml: |
    crds:
      upgradeJob:
        enabled: true

    grafana:
      enabled: true

      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password

      # Auth proxy - trusts Remote-User set by Authelia.
      grafana.ini:
        database:
          wal: true
          query_retries: 3
        server:
          root_url: https://grafana.${productionClusterFqdn}
        auth.proxy:
          enabled: true
          header_name: Remote-User
          header_property: username
          auto_sign_up: true
        auth:
          disable_login_form: true

      # Managed via Traefik IngressRoute instead
      ingress:
        enabled: false

      persistence:
        enabled: true
        annotations:
          backup.seedboxk8s.micahrl.com/enabled: "true"
          backup.seedboxk8s.micahrl.com/flux-kustomization: prometheus
          backup.seedboxk8s.micahrl.com/keep-daily: "2"
          backup.seedboxk8s.micahrl.com/keep-weekly: "2"
          backup.seedboxk8s.micahrl.com/keep-monthly: "8"
          backup.seedboxk8s.micahrl.com/keep-yearly: "3"
        storageClassName: seedbox-slow-mirror
        size: 10Gi

    prometheus:
      prometheusSpec:
        retention: 30d
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: seedbox-slow-mirror
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi

    alertmanager:
      ingress:
        enabled: false

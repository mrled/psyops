apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-prometheus-stack-values
  namespace: prometheus
data:
  values.yaml: |
    crds:
      upgradeJob:
        enabled: true

    grafana:
      enabled: true

      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password

      # Auth proxy - trusts Remote-User set by Authelia.
      grafana.ini:
        database:
          wal: true
          query_retries: 3
        server:
          root_url: https://grafana.${productionClusterFqdn}
        auth.proxy:
          enabled: true
          header_name: Remote-User
          header_property: username
          auto_sign_up: true
        auth:
          disable_login_form: true

      # Managed via Traefik IngressRoute instead
      ingress:
        enabled: false

      persistence:
        enabled: true
        # This separately managed claim is populated during the SSD migration.
        # Its manifest owns the backup annotations and retention policy.
        existingClaim: kube-prometheus-stack-grafana-fast
        storageClassName: seedbox-bootdisk-fast-single
        size: 10Gi

    prometheus:
      prometheusSpec:
        retention: 30d
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: seedbox-bootdisk-fast-single
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi

    alertmanager:
      ingress:
        enabled: false

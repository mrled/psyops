apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arrchitect
  namespace: arrchitect
spec:
  interval: 15m
  timeout: 5m
  releaseName: arrchitect
  chart:
    spec:
      chart: arrchitect
      version: 0.9.0
      sourceRef:
        kind: HelmRepository
        name: arrchitect
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Keep the migration scoped to Jellyfin; other apps remain unmanaged.
    apps:
      sonarr: false
      radarr: false
      lidarr: false
      readarr: false
      prowlarr: false
      flaresolverr: false
      bazarr: false
      qbittorrent: false
      sabnzbd: false
      jellyfin: true
      plex: false
      seerr: false
      maintainerr: false
      tdarr: false
      autobrr: false
    watchNamespace: tortuga
    metrics:
      enabled: false

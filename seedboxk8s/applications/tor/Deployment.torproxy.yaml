apiVersion: apps/v1
kind: Deployment
metadata:
  name: torproxy
  namespace: tor
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: torproxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: torproxy
    spec:
      containers:
        - name: torproxy
          # Renovate restores the digest pin after the initial refresh from latest.
          image: registry.${productionClusterFqdn}/tor/torproxy:latest
          imagePullPolicy: Always
          ports:
            - name: torproxy
              containerPort: 9050
              protocol: TCP
          volumeMounts:
            - mountPath: /etc/tor/torrc
              name: torproxy-config
              subPath: torrc
      imagePullSecrets:
        - name: registry-k8s-dockerconfigjson
      volumes:
        - name: torproxy-config
          configMap:
            name: torproxy-config

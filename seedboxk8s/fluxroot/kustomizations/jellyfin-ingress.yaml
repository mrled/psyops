apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jellyfin-ingress
  namespace: flux-system
spec:
  interval: 15m
  path: /seedboxk8s/applications/jellyfin-ingress
  prune: true
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
  # First bootstrap must finish before exposing the setup wizard to clients.
  dependsOn:
    - name: jellyfin
  postBuild:
    substituteFrom:
      - kind: Secret
        name: seedboxk8s-config
      - kind: ConfigMap
        name: seedboxk8s-config

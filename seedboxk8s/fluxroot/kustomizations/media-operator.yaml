apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: media-operator
  namespace: flux-system
spec:
  interval: 15m
  path: /seedboxk8s/applications/media-operator
  prune: true
  timeout: 7m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: tortuga
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: media-operator
      namespace: media-operator
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: jellyfinconfigs.media-operator.dev
